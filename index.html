<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RAIKU FUN BLOCK</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

  <style>
    :root{
      --text: #0b0b0b;
      --overlay: rgba(0,0,0,0.55);

      --img-bg: rgba(255,255,255,0.14);
      --img-bg-hover: rgba(255,255,255,0.22);
      --img-border: rgba(255,255,255,0.26);
      --img-border-hover: rgba(255,255,255,0.44);
      --shadow: rgba(0,0,0,0.16);
      --ring: rgba(0,0,0,0.35);

      --tile: 78px;
      --tile-radius: 16px;

      --ui-font: "Space Grotesk", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      --title-font: "Space Grotesk", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      --title-scale: 1;

      --setup-width: 300px;
      --setup-handle: 44px;
      --setup-gap: 10px;
    }

    *{ box-sizing: border-box; }

    body{
      margin: 0;
      height: 100vh;
      overflow: hidden;

      background-color: #c0ff38;
      background-image: none;
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;

      color: var(--text);
      font-family: var(--ui-font);
    }

    .loading-screen{
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: transparent;
      padding: 18px;
      z-index: 100;
    }

    .loader{
      width: min(620px, 92vw);
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.28);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 18px 55px rgba(0,0,0,0.18);
    }

    .loader-title{
      margin: 0 0 10px 0;
      font-size: 12px;
      letter-spacing: 0.14em;
      font-weight: 800;
      text-transform: uppercase;
      user-select: none;
      text-shadow: 0 2px 0 rgba(255,255,255,0.35);
    }

    .bar-row{
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
    }

    .bar-wrap{
      width: 100%;
      height: 12px;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(0,0,0,0.18);
      background: rgba(0,0,0,0.12);
    }

    .bar{
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: rgba(0,0,0,0.72);
      transition: width 50ms linear;
    }

    .percent{
      font-weight: 800;
      font-size: 12px;
      letter-spacing: 0.10em;
      user-select: none;
      min-width: 56px;
      text-align: right;
      text-shadow: 0 2px 0 rgba(255,255,255,0.35);
    }

    .desktop{
      position: fixed;
      inset: 0;
      display: none;
      background: transparent;
    }

    .title{
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;

      max-width: calc(100vw - 28px);
      padding: 0 6px;

      font-family: var(--title-font);
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 0.18em;
      font-size: calc(clamp(30px, 4.8vw, 64px) * var(--title-scale));
      line-height: 1;
      user-select: none;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

      text-shadow:
        0 2px 0 rgba(255,255,255,0.55),
        0 10px 24px rgba(0,0,0,0.22);
    }

    .blink{ animation: blink 1.2s ease-in-out infinite; display: inline-block; }
    @keyframes blink{
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .desktop-inner{
      position: absolute;
      inset: 0;
      padding: 110px 26px 26px 26px;
    }

    .icon-grid{
      display: grid;
      grid-template-columns: repeat(5, var(--tile));
      justify-content: start;
      align-content: start;
      gap: 20px 40px;
    }

    @media (max-width: 600px){
      .desktop-inner{ padding-top: 100px; }
      .icon-grid{
        grid-template-columns: repeat(2, var(--tile));
        gap: 18px 14px;
      }
    }

    .icon{
      width: var(--tile);
      display: grid;
      justify-items: center;
      gap: 8px;
      padding: 0;
      background: transparent;
      border: none;
      cursor: default;
      user-select: none;
    }

    .icon-link{
      display: inline-block;
      width: var(--tile);
      height: var(--tile);
      border-radius: var(--tile-radius);
      outline: none;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
      flex: none;
    }

    button.icon-link{
      background: none;
      border: none;
      padding: 0;
      margin: 0;
      color: inherit;
      font: inherit;
      line-height: 0;
      appearance: none;
      -webkit-appearance: none;
    }

    .icon-link img{
      width: var(--tile);
      height: var(--tile);

      object-fit: contain;

      user-select: none;
      -webkit-user-drag: none;

      padding: 10px;
      border-radius: var(--tile-radius);
      background: var(--img-bg);
      border: 1px solid var(--img-border);

      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);

      box-shadow: 0 12px 18px var(--shadow);
      transition: transform 160ms ease, background 160ms ease, border-color 160ms ease, box-shadow 180ms ease;
      display: block;
    }

    .icon-link:hover img{
      background: var(--img-bg-hover);
      border-color: var(--img-border-hover);
      transform: translateY(-2px);
      box-shadow:
        0 16px 24px rgba(0,0,0,0.18),
        0 0 18px rgba(255,255,255,0.22);
    }

    .icon-link:active img{
      transform: translateY(-1px) scale(0.99);
      box-shadow: 0 12px 18px rgba(0,0,0,0.16);
    }

    .icon-link:focus-visible img{
      border-color: var(--ring);
      box-shadow:
        0 16px 24px rgba(0,0,0,0.18),
        0 0 0 3px rgba(255,255,255,0.35);
    }

    .label{
      width: var(--tile);
      margin: 0;
      padding: 0;
      text-align: center;

      font-size: 12px;
      line-height: 1.10;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      user-select: none;

      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow-wrap: anywhere;

      text-shadow:
        0 2px 0 rgba(255,255,255,0.55),
        0 8px 18px rgba(0,0,0,0.16);
    }

    .icon--irina{ grid-column: 1; }
    .icon--pinki{ grid-column: 2; }
    .icon--quiz{ grid-column: 1; }

    .dev-corner{
      position: fixed;
      right: 18px;
      bottom: 16px;
      z-index: 12;
    }


    .setup-handle{
      position: fixed;
      top: 50%;
      right: 0;
      transform: translateY(-50%);
      z-index: 1000;

      width: var(--setup-handle);
      height: 160px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;

      border-radius: 14px 0 0 14px;
      background: rgba(255,255,255,0.26);
      border: 1px solid rgba(255,255,255,0.32);
      border-right: none;

      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .setup-handle:focus-visible{
      outline: 3px solid rgba(255,255,255,0.65);
      outline-offset: 4px;
    }

    .setup-gear{
      font-weight: 900;
      font-size: 16px;
      opacity: 0.9;
      line-height: 1;
    }

    .setup-letters{
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;

      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      line-height: 1;
      opacity: 0.72;
    }

    .setup-panel{
      position: fixed;
      top: 50%;
      right: 0;
      transform: translateY(-50%) translateX(calc(100% + var(--setup-gap)));
      z-index: 999;

      width: var(--setup-width);
      padding: 10px;

      border-radius: 14px 0 0 14px;
      background: rgba(255,255,255,0.20);
      border: 1px solid rgba(255,255,255,0.30);
      border-right: none;

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 18px 55px rgba(0,0,0,0.18);

      transition: transform 220ms ease;
    }

    .setup-panel.is-open{
      transform: translateY(-50%) translateX(0);
    }

    .setup-body{ padding: 6px; }

    .setup-section + .setup-section{ margin-top: 10px; }

    .setup-section-title{
      margin: 0 0 8px 0;
      font-size: 11px;
      letter-spacing: 0.14em;
      font-weight: 900;
      text-transform: uppercase;
      opacity: 0.92;
      text-shadow: 0 2px 0 rgba(255,255,255,0.35);
      user-select: none;
    }

    .setup-row{
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .setup-option{
      border: 1px solid rgba(0,0,0,0.18);
      background: rgba(255,255,255,0.70);
      border-radius: 12px;
      padding: 8px 10px;
      font-weight: 900;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      font-family: var(--ui-font);
    }

    .setup-option:hover{ background: rgba(255,255,255,0.88); }

    .setup-option[aria-pressed="true"]{
      background: rgba(0,0,0,0.78);
      color: #fff;
      border-color: rgba(0,0,0,0.35);
    }

    .setup-option:focus-visible{
      outline: 3px solid rgba(255,255,255,0.55);
      outline-offset: 2px;
    }

    .modal{
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }

    .modal.is-open{ display: flex; }

    .modal-overlay{
      position: absolute;
      inset: 0;
      background: var(--overlay);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }

    .modal-panel{
      position: relative;
      width: min(860px, 92vw);
      height: min(620px, 78vh);
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(0,0,0,0.18);
      border-radius: 14px;
      box-shadow: 0 24px 70px rgba(0,0,0,0.35);
      overflow: hidden;
    }

    .modal-topbar{
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px 0 14px;
      background: rgba(255,255,255,0.75);
      border-bottom: 1px solid rgba(0,0,0,0.12);
    }

    .modal-title{
      margin: 0;
      font-size: 12px;
      letter-spacing: 0.12em;
      font-weight: 800;
      text-transform: uppercase;
      user-select: none;
      font-family: var(--ui-font);
    }

    .modal-close{
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid rgba(0,0,0,0.18);
      background: rgba(255,255,255,0.8);
      cursor: pointer;
      font-weight: 900;
      line-height: 1;
      font-family: var(--ui-font);
    }

    .modal-iframe{
      width: 100%;
      height: calc(100% - 44px);
      border: 0;
      outline: 0;
      background: transparent;
      display: block;
    }

    @media (prefers-reduced-motion: reduce){
      .blink{ animation: none; }
      .icon-link img{ transition: none !important; }
      .setup-panel{ transition: none; }
    }
  </style>
</head>

<body>
  <div class="loading-screen" id="loadingScreen" aria-label="Loading screen">
    <div class="loader" role="status" aria-live="polite">
      <p class="loader-title">Loading…</p>
      <div class="bar-row">
        <div class="bar-wrap" aria-hidden="true">
          <div class="bar" id="bar"></div>
        </div>
        <div class="percent" id="percentText">0%</div>
      </div>
    </div>
  </div>

  <main class="desktop" id="desktop" aria-label="Desktop links">
    <div class="title"><span class="blink">RAIKU FUN BLOCK</span></div>

    <button class="setup-handle" id="setupToggle" type="button" aria-controls="setupPanel" aria-expanded="false" aria-label="Toggle setup">
      <div class="setup-gear" aria-hidden="true">⚙</div>
      <div class="setup-letters" aria-hidden="true">
        <span>S</span><span>E</span><span>T</span><span>U</span><span>P</span>
      </div>
    </button>

    <aside class="setup-panel" id="setupPanel" aria-label="Setup panel">
      <div class="setup-body">
        <div class="setup-section" aria-label="Background section">
          <p class="setup-section-title">BACKGROUND</p>
          <div class="setup-row" role="group" aria-label="Choose background">
            <button class="setup-option bg-option" type="button" aria-pressed="false" data-type="image" data-bg="fon.png">RYKU</button>
            <button class="setup-option bg-option" type="button" aria-pressed="false" data-type="image" data-bg="fon-2.png">CHADS</button>
            <button class="setup-option bg-option" type="button" aria-pressed="false" data-type="image" data-bg="fon-3.png">PINEAPPLES</button>
            <button class="setup-option bg-option" type="button" aria-pressed="true"  data-type="color" data-color="#c0ff38">OG</button>
          </div>
        </div>

        <div class="setup-section" aria-label="Font section">
          <p class="setup-section-title">FONT</p>
          <div class="setup-row" role="group" aria-label="Choose font">
            <button class="setup-option font-option" type="button" aria-pressed="true"  data-font="space">SPACE</button>
            <button class="setup-option font-option" type="button" aria-pressed="false" data-font="bebas">BEBAS</button>
            <button class="setup-option font-option" type="button" aria-pressed="false" data-font="jetbrains">MONO</button>
            <button class="setup-option font-option" type="button" aria-pressed="false" data-font="vt323">8BIT</button>
          </div>
        </div>
      </div>
    </aside>

    <div class="desktop-inner">
      <section class="icon-grid" aria-label="Main icons">
        <div class="icon">
          <a class="icon-link" href="https://t.co/mqoCITn2Jv" target="_blank" rel="noopener noreferrer">
            <img src="i-1.png" alt="PINEAPPLE GAME">
          </a>
          <div class="label">PINEAPPLE GAME</div>
        </div>

        <div class="icon">
          <a class="icon-link" href="https://t.co/rQmXlSTblv" target="_blank" rel="noopener noreferrer">
            <img src="i-2.png" alt="RYKU RUN">
          </a>
          <div class="label">RYKU RUN</div>
        </div>

        <div class="icon">
          <a class="icon-link" href="https://t.co/78mbgUrMBu" target="_blank" rel="noopener noreferrer">
            <img src="i-3.png" alt="RYKU BIRD">
          </a>
          <div class="label">RYKU BIRD</div>
        </div>

        <div class="icon">
          <a class="icon-link" href="https://ryku-snake.vercel.app/" target="_blank" rel="noopener noreferrer">
            <img src="i-4.png" alt="RYKU SNAKE">
          </a>
          <div class="label">RYKU SNAKE</div>
        </div>

        <div class="icon">
          <a class="icon-link" href="https://ryku-strike.vercel.app/" target="_blank" rel="noopener noreferrer">
            <img src="i-5.png" alt="RYKU STRIKE">
          </a>
          <div class="label">RYKU STRIKE</div>
        </div>

        <div class="icon">
          <a class="icon-link" href="https://t.co/jVZc5HzGww" target="_blank" rel="noopener noreferrer">
            <img src="i-6.png" alt="COMMUNITY GALLERY">
          </a>
          <div class="label">COMMUNITY<br>GALLERY</div>
        </div>

        <div class="icon">
          <a class="icon-link" href="https://ryku-santa-arc.vercel.app/" target="_blank" rel="noopener noreferrer">
            <img src="i-7.png" alt="SANTA GALLERY">
          </a>
          <div class="label">SANTA<br>GALLERY</div>
        </div>

        <div class="icon icon--irina">
          <button class="icon-link" type="button" id="openIrina">
            <img src="i-8.png" alt="PFP BY IRINA">
          </button>
          <div class="label">PFP BY<br>IRINA</div>
        </div>

        <div class="icon icon--pinki">
          <button class="icon-link" type="button" id="openPinki">
            <img src="i-9.png" alt="PFP BY PINKI">
          </button>
          <div class="label">PFP BY<br>PINKI</div>
        </div>

        <div class="icon icon--quiz">
          <button class="icon-link" type="button" id="openQuiz">
            <img src="i-10.png" alt="LEARN & QUIZ">

    <div class="dev-corner" aria-label="DEV icon">
      <div class="icon">
        <a class="icon-link" href="https://x.com/realsirandrew" target="_blank" rel="noopener noreferrer">
          <img src="2.png" alt="DEV">
        </a>
        <div class="label">DEV</div>
      </div>
    </div>
  </main>

  <div class="modal" id="appModal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal-overlay" data-close="true"></div>
    <div class="modal-panel" role="document">
      <div class="modal-topbar">
        <p class="modal-title" id="modalTitle">Window</p>
        <button class="modal-close" type="button" id="closeModal" aria-label="Close">×</button>
      </div>
      <iframe class="modal-iframe" id="modalFrame" src="" title="Modal content"></iframe>
    </div>
  </div>

  <script>
    const DURATION_MS = 6000;
    const TICK_MS = 50;

    const bar = document.getElementById('bar');
    const percentText = document.getElementById('percentText');
    const loadingScreen = document.getElementById('loadingScreen');
    const desktop = document.getElementById('desktop');

    let elapsed = 0;

    const timer = setInterval(() => {
      elapsed += TICK_MS;
      const progress = Math.min(elapsed / DURATION_MS, 1);
      const percent = Math.round(progress * 100);

      bar.style.width = percent + '%';
      percentText.textContent = percent + '%';

      if (progress >= 1) {
        clearInterval(timer);
        loadingScreen.style.display = 'none';
        desktop.style.display = 'block';
        document.body.style.overflow = 'auto';
      }
    }, TICK_MS);

    const setupToggle = document.getElementById('setupToggle');
    const setupPanel = document.getElementById('setupPanel');

    function setSetupOpen(isOpen){
      setupPanel.classList.toggle('is-open', isOpen);
      setupToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    }

    setupToggle.addEventListener('click', () => {
      setSetupOpen(!setupPanel.classList.contains('is-open'));
    });

    window.addEventListener('mousedown', (e) => {
      if (!setupPanel.classList.contains('is-open')) return;
      const insidePanel = setupPanel.contains(e.target);
      const insideHandle = setupToggle.contains(e.target);
      if (!insidePanel && !insideHandle) setSetupOpen(false);
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') setSetupOpen(false);
    });

    const modal = document.getElementById('appModal');
    const closeModalBtn = document.getElementById('closeModal');
    const frame = document.getElementById('modalFrame');
    const modalTitle = document.getElementById('modalTitle');

    let lastFocusEl = null;

    function openModal({ title, src, focusBackTo }) {
      lastFocusEl = focusBackTo || null;
      modalTitle.textContent = title;
      frame.src = src;
      modal.classList.add('is-open');
      modal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      closeModalBtn.focus();
    }

    function closeModal() {
      modal.classList.remove('is-open');
      modal.setAttribute('aria-hidden', 'true');
      frame.src = '';
      document.body.style.overflow = 'auto';
      if (lastFocusEl) lastFocusEl.focus();
    }

    closeModalBtn.addEventListener('click', closeModal);

    modal.addEventListener('click', (e) => {
      if (e.target && e.target.dataset && e.target.dataset.close === 'true') closeModal();
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('is-open')) closeModal();
    });

    const openIrina = document.getElementById('openIrina');
    const openPinki = document.getElementById('openPinki');
    const openQuiz = document.getElementById('openQuiz');

    openIrina.addEventListener('click', () => {
      openModal({ title: 'PFP by Irina', src: 'irina.html', focusBackTo: openIrina });
    });

    openPinki.addEventListener('click', () => {
      openModal({ title: 'PFP by Pinki', src: 'pinki.html', focusBackTo: openPinki });
    });

    openQuiz.addEventListener('click', () => {
      openModal({ title: 'Learn & Quiz', src: 'quiz.html', focusBackTo: openQuiz });
    });

    const bgButtons = Array.from(document.querySelectorAll('.bg-option'));

    function applyBackgroundFromButton(btn){
      const type = btn.dataset.type;
      if (type === 'image') {
        const fileName = btn.dataset.bg;
        document.body.style.backgroundColor = '#c0ff38';
        document.body.style.backgroundImage = `url("${fileName}")`;
      } else {
        const color = btn.dataset.color || '#c0ff38';
        document.body.style.backgroundColor = color;
        document.body.style.backgroundImage = 'none';
      }
    }

    function setPressed(buttons, activeBtn){
      buttons.forEach(btn => btn.setAttribute('aria-pressed', btn === activeBtn ? 'true' : 'false'));
    }

    bgButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        applyBackgroundFromButton(btn);
        setPressed(bgButtons, btn);
      });
    });

    const defaultBgBtn = bgButtons.find(b => b.getAttribute('aria-pressed') === 'true');
    if (defaultBgBtn) applyBackgroundFromButton(defaultBgBtn);

    const fontButtons = Array.from(document.querySelectorAll('.font-option'));

    const FONT_PRESETS = {
      space: { ui: '"Space Grotesk", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif', title: '"Space Grotesk", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif', titleScale: 1 },
      bebas: { ui: '"Bebas Neue", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif', title: '"Bebas Neue", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif', titleScale: 1 },
      jetbrains: { ui: '"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace', title: '"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace', titleScale: 1 },
      vt323: { ui: '"VT323", monospace', title: '"VT323", monospace', titleScale: 1 }
    };

    function applyFontPreset(key){
      const preset = FONT_PRESETS[key] || FONT_PRESETS.space;
      document.documentElement.style.setProperty('--ui-font', preset.ui);
      document.documentElement.style.setProperty('--title-font', preset.title);
      document.documentElement.style.setProperty('--title-scale', String(preset.titleScale));
    }

    fontButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        applyFontPreset(btn.dataset.font);
        setPressed(fontButtons, btn);
      });
    });

    const defaultFontBtn = fontButtons.find(b => b.getAttribute('aria-pressed') === 'true');
    if (defaultFontBtn) applyFontPreset(defaultFontBtn.dataset.font);
  </script>
</body>
</html>
